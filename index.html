<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A.H.R | Files</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome للأيقونات -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <!-- خلفية متحركة -->
    <div class="background">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <main class="container">

        <!-- الصورة الشخصية -->
        <div class="profile">

            <div class="profile-ring">
                <img src="gg.png" alt="Profile">
            </div>

            <h1>A.H.R</h1>

            <p>🎬 Editing • Projects • attabi </p>

        </div>


        <!-- روابط الحسابات -->
        <div class="social-links">

            <a
                href="https://www.tiktok.com/@a.h.r__1"
                target="_blank"
                class="social tiktok"
            >
                <i class="fa-brands fa-tiktok"></i>

                <span>
                    TikTok
                    <small>@a.h.r__1</small>
                </span>

                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>


            <a
                href="https://www.youtube.com/@A.H.R_1"
                target="_blank"
                class="social youtube"
            >
                <i class="fa-brands fa-youtube"></i>

                <span>
                    YouTube
                    <small>@A.H.R_1</small>
                </span>

                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>


            <a
                href="https://t.me/Q_A_R_0"
                target="_blank"
                class="social telegram"
            >
                <i class="fa-brands fa-telegram"></i>

                <span>
                    Telegram
                    <small>@Q_A_R_0</small>
                </span>

                <i class="fa-solid fa-arrow-up-right-from-square"></i>
            </a>

        </div>


        <!-- الملفات -->
        <section class="files-section">

            <div class="section-title">
                <h2>📁 الملفات</h2>

                <span>
                    Projects & Files
                </span>
            </div>

            <div id="fileList">
                جاري تحميل الملفات...
            </div>

        </section>


        <!-- لوحة الإدارة -->
        <section class="admin">

            <h2>🔐 لوحة التحكم</h2>

            <input
                type="password"
                id="adminPassword"
                placeholder="كلمة مرور الإدارة"
            >

            <button onclick="login()">
                دخول
            </button>

            <div id="uploadArea" class="hidden">

                <input type="file" id="fileInput">

                <button onclick="uploadFile()">
                    📤 رفع الملف
                </button>

                <p id="status"></p>

            </div>

        </section>


        <footer>
            © 2026 A.H.R — All Rights Reserved
        </footer>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>
</html>
